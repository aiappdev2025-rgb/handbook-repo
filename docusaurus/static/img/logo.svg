<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- MOAI Logo - Geometric M with phase colors -->
  <!-- Left pillar -->
  <rect x="4" y="8" width="8" height="32" fill="#3b82f6"/>
  <!-- Right pillar -->
  <rect x="36" y="8" width="8" height="32" fill="#a855f7"/>
  <!-- Left diagonal -->
  <polygon points="12,8 24,24 24,40 12,40" fill="#3b82f6"/>
  <!-- Right diagonal -->
  <polygon points="36,8 24,24 24,40 36,40" fill="#a855f7"/>
  <!-- Center accent -->
  <rect x="20" y="20" width="8" height="4" fill="#22c55e"/>
</svg>
